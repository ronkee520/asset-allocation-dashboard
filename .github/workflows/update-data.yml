name: Update Dashboard Data

on:
  schedule:
    - cron: "23 */4 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/update-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-data-refresh
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test data parsers
        run: python -m unittest discover -s tests -v

      - name: Fetch public and free API data
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit updated data
        shell: bash
        run: |
          if git diff --quiet -- data/latest.json data/latest.js; then
            echo "No dashboard data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/latest.js
          git commit -m "Update dashboard data"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push attempt ${attempt} was rejected; rebasing on the latest main branch."
            git fetch origin main
            git rebase -X theirs origin/main
            sleep $((attempt * 2))
          done

          echo "Unable to publish dashboard data after 3 attempts." >&2
          exit 1
